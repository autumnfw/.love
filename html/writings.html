<style> 
* {
  box-sizing: border-box;
}

html, body {
height: 100%;
}

#intro {
height: 100%;
background-color: red;
color: wheat;
animation: introanimation 10s linear;
  z-index: 3;
  position: relative;
  
}

#letter {
  max-width: 95%;
  margin-left: auto;
  margin-right: auto;
  display: block;
  z-index: 5;
  position: relative;
  animation: fall 3s linear;  
}
#iam {
  display: none;
}
#letter:hover + #iam {
  filter: blur(5pxh);
  display: block;
}



@keyframes introanimation {
from {opacity: 0;}
to {
  opacity: 1;
}}

@keyframes fall {
from {
rotate: 30deg;
opacity: 0;
}
to {
rotate: 00deg;
opacity: 1;
}
}
</style>
</head>
<body>



  <div id="intro">

  </div>
<img id="letter" src="/anotherasset/write/lostart.jpeg">
<p id="iam"> hello hi there</p>



  </body>
